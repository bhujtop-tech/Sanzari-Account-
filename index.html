    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Suppress errors injected by third-party browser extensions or benign network aborts
          window.addEventListener('error', function(event) {
            if (
              event &&
              ((event.filename && (event.filename.includes('chrome-extension://') || event.filename.includes('moz-extension://') || event.filename.includes('safari-extension://') || event.filename.includes('frame_ant'))) ||
               (event.message && (event.message.includes('Cannot set property fetch of #<Window>') || event.message.includes('signal is aborted') || event.message.includes('aborted without reason'))))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var msg = typeof reason === 'string' ? reason : (reason && reason.message) ? reason.message : '';
            if (
              (reason && reason.name === 'AbortError') ||
              msg.includes('signal is aborted') ||
              msg.includes('aborted without reason') ||
              msg.includes('The user aborted a request')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          // Define getter & setter for window.fetch and Window.prototype.fetch so any extension can set it safely
          try {
            var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
            var fetchDescriptor = {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            };

            try {
              Object.defineProperty(window, 'fetch', fetchDescriptor);
            } catch (e1) {}

            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
              } catch (e2) {}
            }
          } catch (e) {}
        }
      })();
    </script>
